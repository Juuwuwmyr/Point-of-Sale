# Other default tuning values
# MySQL Server Instance Configuration File
# ----------------------------------------------------------------------
# Generated by the MySQL Server Instance Configuration Wizard
#
#
# Installation Instructions
# ----------------------------------------------------------------------
#
# On Linux you can copy this file to /etc/my.cnf to set global options,
# mysql-data-dir/my.cnf to set server-specific options
# (@localstatedir@ for this installation) or to
# ~/.my.cnf to set user-specific options.
#
# On Windows, when MySQL has been installed using MySQL Installer you
# should keep this file in the ProgramData directory of your server
# (e.g. C:\ProgramData\MySQL\MySQL Server X.Y). To make sure the server
# reads the config file, use the startup option "--defaults-file". 
#
# To run the server from the command line, execute this in a 
# command line shell, e.g.
# mysqld --defaults-file="C:\Program Files\MySQL\MySQL Server X.Y\my.ini"
#
# To install the server as a Windows service manually, execute this in a 
# command line shell, e.g.
# mysqld --install MySQLXY --defaults-file="C:\Program Files\MySQL\MySQL Server X.Y\my.ini"
#
# And then execute this in a command line shell to start the server, e.g.
# net start MySQLXY
#
#
# Guidelines for editing this file
# ----------------------------------------------------------------------
#
# In this file, you can use all long options that the program supports.
# If you want to know the options a program supports, start the program
# with the "--help" option.
#
# More detailed information about the individual options can also be
# found in the manual.
#
# For advice on how to change settings please see
# https://dev.mysql.com/doc/refman/8.0/en/server-configuration-defaults.html
#
#
# CLIENT SECTION
# ----------------------------------------------------------------------
#
# The following options will be read by MySQL client applications.
# Note that only client applications shipped by MySQL are guaranteed
# to read this section. If you want your own MySQL client program to
# honor these values, you need to specify it as an option during the
# MySQL client library initialization.
#
[client]
port=3306
# socket=MYSQL  # Uncomment on Linux/Mac
# pipe=         # Uncomment on Windows for named pipe

[mysql]
# Default character set for MySQL client
default-character-set=utf8mb4
# Prompt with database name
prompt="\u@\h [\d]> "
# Safe updates (no updates/deletes without WHERE/ LIMIT)
# safe-updates

[mysqld]
bind-address = 0.0.0.0
skip-name-resolve=1
 #no-beep

# SERVER SECTION
# ----------------------------------------------------------------------
#
# The following options will be read by the MySQL Server. Make sure that
# you have installed the server correctly (see above) so it reads this 
# file.
#

# The TCP/IP Port the MySQL Server will listen on
port=3306

# Path to installation directory
# basedir="C:/Program Files/MySQL/MySQL Server 8.0/"

# Path to the database root
datadir=C:/ProgramData/MySQL/MySQL Server 8.0\Data

# Character set and collation
character-set-server=utf8mb4
collation-server=utf8mb4_unicode_ci

# Administers multifactor authentication (MFA) capabilities
authentication_policy=mysql_native_password,,

# The default storage engine
default-storage-engine=INNODB

# SQL mode - relaxed for better performance with modern applications
sql-mode="STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION"

# General and Slow logging - keep disabled unless debugging
log-output=FILE
general-log=0
general_log_file="TABLET-0JECQIDK.log"

# Slow query log - enable with lower threshold for performance analysis
slow-query-log=1
slow_query_log_file="TABLET-0JECQIDK-slow.log"
long_query_time=2  # Reduced from 10 to catch slower queries
log_queries_not_using_indexes=1  # Log queries that don't use indexes

# Error Logging
log-error="TABLET-0JECQIDK.err"

# Binary logging - disable if not using replication for performance
# skip-log-bin  # Uncomment if you don't need replication
log-bin="TABLET-0JECQIDK-bin"
# Binary log format - use ROW for replication safety, MIXED for performance
binlog_format=MIXED
# Expire logs after 7 days
expire_logs_days=7
# Max binlog size
max_binlog_size=100M

# Server ID for replication
server-id=1

# Table name handling
lower_case_table_names=1

# Secure file privileges
secure-file-priv="C:/ProgramData/MySQL/MySQL Server 8.0/Uploads"

# CONNECTION SETTINGS
# ----------------------------------------------------------------------
# Maximum connections - adjust based on your application needs
max_connections=500  # Increased from 151
# Connection timeout
connect_timeout=10
# Wait timeout for idle connections
wait_timeout=600
# Interactive timeout
interactive_timeout=600
# Max allowed packet size
max_allowed_packet=128M  # Increased from 64M
# Max connection errors
max_connect_errors=1000000  # Increased significantly

# CACHE AND BUFFER SETTINGS
# ----------------------------------------------------------------------
# Table cache
table_open_cache=8000  # Increased from 4000
table_definition_cache=2000  # New - caches table definitions

# Temporary table settings
temptable_max_ram=2G  # Increased from 1G
tmp_table_size=64M  # Increased from 25M
max_heap_table_size=64M  # Match tmp_table_size
internal_tmp_mem_storage_engine=TempTable

# Thread cache - reduces overhead of thread creation
thread_cache_size=100

# MyISAM Specific options (only if you use MyISAM tables)
myisam_max_sort_file_size=2146435072
myisam_sort_buffer_size=128M  # Increased from 41M
key_buffer_size=64M  # Increased from 8M
read_buffer_size=256K  # Increased from 82K
read_rnd_buffer_size=512K  # Increased from 256K
bulk_insert_buffer_size=16M  # New - for bulk inserts

# INNODB Specific options
# ----------------------------------------------------------------------

# InnoDB buffer pool - most important setting for performance
# Set to 70-80% of available RAM for dedicated MySQL server
# Current: 1G - adjust based on your system RAM
innodb_buffer_pool_size=2G  # Increased from 1G

# Buffer pool instances - improves concurrency
innodb_buffer_pool_instances=8

# InnoDB log file settings
innodb_log_buffer_size=32M  # Increased from 16M
innodb_redo_log_capacity=256M  # Increased from 100M

# InnoDB flush method - use O_DIRECT on Linux for better performance
# innodb_flush_method=O_DIRECT  # Uncomment on Linux

# InnoDB flush behavior
innodb_flush_log_at_trx_commit=1  # Keep at 1 for ACID compliance
# For faster performance with some risk, change to 2:
# innodb_flush_log_at_trx_commit=2

# InnoDB I/O capacity - adjust based on your storage speed
innodb_io_capacity=2000  # Increased from default 200
innodb_io_capacity_max=4000  # Maximum I/O capacity
innodb_flush_neighbors=0  # Set to 0 for SSD, 1 for HDD

# InnoDB thread concurrency
innodb_thread_concurrency=0  # Changed from 9 - let InnoDB decide
innodb_read_io_threads=8  # Increased from 4
innodb_write_io_threads=8  # Increased from 4
innodb_purge_threads=4  # Increased from 1
innodb_page_cleaners=8  # Should match buffer pool instances

# InnoDB file settings
innodb_file_per_table=1
innodb_autoextend_increment=128  # Increased from 64
innodb_open_files=8000  # Match table_open_cache

# InnoDB concurrency settings
innodb_concurrency_tickets=5000
innodb_old_blocks_time=1000
innodb_stats_on_metadata=0

# InnoDB checksum
innodb_checksum_algorithm=0

# OTHER BUFFERS
# ----------------------------------------------------------------------
# Join buffer size - for queries without indexes
join_buffer_size=512K  # Increased from 256K

# Sort buffer size - per thread, be careful with high connections
sort_buffer_size=512K  # Increased from 256K

# Temp table size for joins
tmp_table_size=64M

# NETWORK AND FILE LIMITS
# ----------------------------------------------------------------------
# Open files limit
open_files_limit=65535  # Significantly increased from 8161

# Flush time
flush_time=0

# BINARY LOG SETTINGS
# ----------------------------------------------------------------------
binlog_row_event_max_size=8K

# REPLICATION SETTINGS (if used)
# ----------------------------------------------------------------------
sync_source_info=10000
sync_relay_log=10000

# PERFORMANCE SCHEMA
# ----------------------------------------------------------------------
# Enable for monitoring, disable for slight performance gain
performance_schema=ON  # Keep ON for monitoring
# performance_schema=OFF  # Uncomment for maximum performance

# QUERY CACHE (deprecated in MySQL 8.0, but included for reference)
# ----------------------------------------------------------------------
# Query cache is removed in MySQL 8.0, so these settings are ignored
# but kept for compatibility

# X PLUGIN (MySQL 8.0)
# ----------------------------------------------------------------------
mysqlx_port=33060
# mysqlx_socket=/tmp/mysqlx.sock  # Uncomment on Linux/Mac
# Disable X Plugin if not used for slight performance gain
# mysqlx=OFF

# ADDITIONAL PERFORMANCE TUNING
# ----------------------------------------------------------------------

# Increase host cache size
host_cache_size=365  # Increased from default

# Metadata locks hash instance size
metadata_locks_hash_instances=8  # New - reduces contention

# Table open cache instances - reduces contention
table_open_cache_instances=16  # New

# Enable large pages if available (Linux only)
# large_pages=ON  # Uncomment on Linux with HugePages configured

# Disable symbolic links for security
symbolic_links=0